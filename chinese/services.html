<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TO Inspect Ltd. 专业验房服务 - 购房前验房、卖房前验房、Tarion保修验房及红外热成像检测。">
    <meta name="keywords" content="验房服务, 多伦多验房师, 购房前验房, Tarion保修验房, 红外热成像, WETT检测">
    
    <title>服务项目 | TO Inspect Ltd.</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="../css/style-modern.css">
    
    <!-- Services Page Specific Styles -->
    <style>
        /* Chinese Font Support */
        body, h1, h2, h3, h4, h5, h6, p, a, span, li, td, th {
            font-family: 'Inter', 'Noto Serif SC', sans-serif;
        }
        h1, h2, h3, h4, h5, h6, .services-hero__title, .service-title {
            font-family: 'Poppins', 'Noto Serif SC', sans-serif;
        }

        /* Spacing & Typography Overrides */
        body {
            line-height: 1.8;
        }

        /* Services Hero */
        .services-hero {
            background: linear-gradient(135deg, var(--color-bg-light) 0%, white 100%);
            min-height: 350px;
            display: flex;
            align-items: center;
            padding: 8rem 0;
            position: relative;
            overflow: hidden;
        }
        
        .services-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%232d2d2d' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }
        
        .services-hero__content {
            text-align: center;
            color: var(--color-text-main);
            position: relative;
            z-index: 1;
        }
        
        .services-hero__eyebrow {
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--color-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        
        .services-hero__eyebrow::before,
        .services-hero__eyebrow::after {
            content: '';
            width: 40px;
            height: 2px;
            background: var(--color-secondary);
        }
        
        .services-hero__title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--color-text-main);
        }
        
        .services-hero__subtitle {
            font-size: 1.2rem;
            color: var(--color-text-light);
            max-width: 600px;
            margin: 0 auto;
            font-weight: 400;
            line-height: 1.8;
        }
        
        /* Services List */
        .services-list {
            padding: 8rem 0;
            background: white;
        }
        
        .service-item {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            margin-bottom: 8rem;
            padding-bottom: 8rem;
            border-bottom: 1px solid var(--color-border);
        }
        
        .service-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .service-item:nth-child(even) {
            direction: rtl;
        }
        
        .service-item:nth-child(even) .service-content {
            direction: ltr;
        }
        
        .service-image {
            width: 100%;
            height: 400px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            position: relative;
        }
        
        .service-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .service-item:hover .service-image img {
            transform: scale(1.05);
        }
        
        .service-content {
            padding: var(--space-lg);
        }
        
        .service-icon {
            width: 60px;
            height: 60px;
            background: var(--color-primary-light);
            color: var(--color-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: var(--space-lg);
        }
        
        .service-title {
            font-size: 2rem;
            color: var(--color-text-main);
            margin-bottom: var(--space-md);
            font-weight: 700;
        }
        
        .service-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--color-text-light);
            margin-bottom: var(--space-lg);
        }
        
        .service-features {
            list-style: none;
            margin-bottom: var(--space-xl);
        }
        
        .service-features li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            color: var(--color-text-main);
            font-size: 1rem;
        }
        
        .service-features li i {
            color: var(--color-secondary);
            font-size: 0.9rem;
        }
        
        .service-price {
            display: inline-block;
            background: var(--color-bg-light);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: var(--space-lg);
        }
        
        /* Comparison Table */
        .comparison-section {
            padding: 8rem 0;
            background: var(--color-bg-light);
        }
        
        .comparison-header {
            text-align: center;
            margin-bottom: 4rem;
        }
        
        .comparison-header h2 {
            font-size: 2.5rem;
            color: var(--color-text-main);
            margin-bottom: var(--space-md);
        }
        
        .comparison-table-container {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow-x: auto;
            padding: var(--space-xl);
        }
        
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        
        .comparison-table th,
        .comparison-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--color-border);
        }
        
        .comparison-table th {
            font-weight: 600;
            color: var(--color-text-main);
            background: var(--color-bg-light);
        }
        
        .comparison-table td {
            color: var(--color-text-light);
        }
        
        .comparison-table tr:last-child td {
            border-bottom: none;
        }
        
        .check-icon {
            color: var(--color-secondary);
            font-size: 1.2rem;
        }
        
        /* CTA Section */
        .services-cta {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            padding: 8rem 0;
            text-align: center;
            color: white;
        }
        
        .services-cta h2 {
            font-size: 2.5rem;
            margin-bottom: var(--space-md);
            font-weight: 700;
            color: white;
        }
        
        .services-cta p {
            font-size: 1.2rem;
            margin-bottom: var(--space-xl);
            color: white;
            opacity: 0.9;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Responsive */
        @media (max-width: 992px) {
            .service-item {
                grid-template-columns: 1fr;
                gap: var(--space-xl);
            }
            
            .service-item:nth-child(even) {
                direction: ltr;
            }
            
            .service-image {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- Header Component -->
    <div id="header-placeholder"></div>
    
    <!-- Page Hero -->
    <section class="services-hero">
        <div class="container">
            <div class="services-hero__content">
                <span class="services-hero__eyebrow">专业验房服务</span>
                <h1 class="services-hero__title">服务项目</h1>
                <p class="services-hero__subtitle">
                    为您量身定制的全面验房解决方案。从购房前验房到保修验房，我们为您提供全方位保障。
                </p>
            </div>
        </div>
    </section>
    
    <!-- Main Content -->
    <main class="main-content">
        
        <!-- Services List -->
        <section class="services-list">
            <div class="container" id="services-container">
                <!-- Services will be loaded dynamically from JSON -->
                <div style="text-align: center; padding: var(--space-2xl); color: var(--color-text-light);">
                    <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: var(--space-md); color: var(--color-primary);"></i>
                    <p>正在加载服务...</p>
                </div>
            </div>
        </section>
        
        <!-- Comparison Table -->
        <section class="comparison-section">
            <div class="container">
                <div class="comparison-header">
                    <h2>为什么选择 TO Inspect?</h2>
                    <p>看看我们的全面验房服务与标准服务的对比。</p>
                </div>
                
                <div class="comparison-table-container">
                    <table class="comparison-table">
                        <thead>
                            <tr>
                                <th>服务项目</th>
                                <th>TO Inspect 标准</th>
                                <th>普通验房</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>红外热成像扫描</td>
                                <td><i class="fas fa-check check-icon"></i> 包含</td>
                                <td>额外收费 / 不提供</td>
                            </tr>
                            <tr>
                                <td>家电测试</td>
                                <td><i class="fas fa-check check-icon"></i> 包含</td>
                                <td>仅目视检查</td>
                            </tr>
                            <tr>
                                <td>报告交付</td>
                                <td><i class="fas fa-check check-icon"></i> 当天</td>
                                <td>24-48小时</td>
                            </tr>
                            <tr>
                                <td>验房后支持</td>
                                <td><i class="fas fa-check check-icon"></i> 无限期</td>
                                <td>有限</td>
                            </tr>
                            <tr>
                                <td>提供WETT检测</td>
                                <td><i class="fas fa-check check-icon"></i> 是</td>
                                <td>通常外包</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        
        <!-- CTA Section -->
        <section class="services-cta">
            <div class="container">
                <h2>准备好预约了吗？</h2>
                <p>立即获取报价，确保您的安心。</p>
                <a href="quote.html" class="btn btn--primary" style="background: white; color: var(--color-primary);">获取报价</a>
            </div>
        </section>
        
    </main>
    
    <!-- Footer Component -->
    <div id="footer-placeholder"></div>
    
    <!-- Main JavaScript -->
    <script src="js/main.js"></script>
    
    <!-- Services JavaScript -->
    <script>
        // Image mapping for services
        const serviceImages = {
            'pre-purchase': '../Image Assets/Inspection Process/roof1.jpeg',
            'pre-listing': '../Image Assets/Inspection Process/Exterior1.jpeg',
            'condo': '../Image Assets/Inspection Process/Structure1.jpeg',
            'maintenance': '../Image Assets/Inspection Process/roof2.jpeg',
            'pdi': '../Image Assets/Inspection Process/Exterior2.jpeg',
            '30-day-1-2-year': '../Image Assets/Inspection Process/Structure2.jpeg',
            '7-year': '../Image Assets/Inspection Process/roof3.jpeg',
            'thermal': '../Image Assets/Inspection Process/Exterior3.jpeg',
            'mould': '../Image Assets/Inspection Process/Structure3.jpeg',
            'wett': '../Image Assets/Inspection Process/roof4.jpeg',
            'pca': '../Image Assets/Inspection Process/Exterior4.jpeg',
            'radon': '../Image Assets/Inspection Process/Structure4.jpeg',
            'sewer': '../Image Assets/Inspection Process/roof1.jpeg',
            'phase1': '../Image Assets/Inspection Process/Exterior1.jpeg'
        };

        // Load services from JSON
        async function loadServices() {
            try {
                const response = await fetch('data/services.json');
                const data = await response.json();
                
                // Flatten categories to get all services
                let allServices = [];
                if (data.categories) {
                    data.categories.forEach(category => {
                        if (category.services) {
                            allServices = allServices.concat(category.services);
                        }
                    });
                }
                
                renderServices(allServices);
            } catch (error) {
                console.error('Error loading services:', error);
                document.getElementById('services-container').innerHTML = `
                    <div style="text-align: center; padding: var(--space-2xl); color: var(--color-accent);">
                        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: var(--space-md);"></i>
                        <p>无法加载服务。请稍后再试。</p>
                    </div>
                `;
            }
        }
        
        // Render services list
        function renderServices(services) {
            const container = document.getElementById('services-container');
            
            if (services.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: var(--space-2xl); color: var(--color-text-light);">
                        <p>暂无服务。</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = services.map((service, index) => {
                // Get image from mapping or default
                const imagePath = serviceImages[service.id] || '../Image Assets/index1.jpeg';
                
                // Extract features from details if not present in service object
                // The JSON has 'details' as HTML string, but 'features' array is used in the template
                // We'll try to extract list items from the HTML details if features array is missing
                let featuresList = '';
                if (service.features && Array.isArray(service.features)) {
                    featuresList = service.features.map(feature => `
                        <li><i class="fas fa-check-circle"></i> ${feature}</li>
                    `).join('');
                } else if (service.details) {
                    // Simple extraction of first few list items from HTML details
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = service.details;
                    const listItems = tempDiv.querySelectorAll('li');
                    // Take up to 4 items
                    for (let i = 0; i < Math.min(listItems.length, 4); i++) {
                        featuresList += `<li><i class="fas fa-check-circle"></i> ${listItems[i].textContent}</li>`;
                    }
                }

                // Format price if available
                let priceHtml = '';
                if (service.pricing && service.pricing.base) {
                    priceHtml = `<div class="service-price">${service.pricing.base} 起</div>`;
                } else if (service.pricing && service.pricing.standalone) {
                    priceHtml = `<div class="service-price">${service.pricing.standalone}</div>`;
                }

                return `
                <div class="service-item" id="${service.id}">
                    <div class="service-image">
                        <img src="${imagePath}" alt="${service.title}">
                    </div>
                    <div class="service-content">
                        <div class="service-icon">
                            <i class="fas ${service.icon}"></i>
                        </div>
                        <h2 class="service-title">${service.title}</h2>
                        ${priceHtml}
                        <p class="service-description">${service.summary}</p>
                        <ul class="service-features">
                            ${featuresList}
                        </ul>
                        <a href="quote.html?service=${service.id}" class="btn btn--primary">立即预约</a>
                    </div>
                </div>
            `}).join('');
        }
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', loadServices);
    </script>
</body>
</html>
